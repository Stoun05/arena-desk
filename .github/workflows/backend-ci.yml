name: Validate ASP.NET Core backend

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arena_desk
          POSTGRES_USER: arena_desk
          POSTGRES_PASSWORD: arena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena_desk -d arena_desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore server/ArenaDesk.Api/ArenaDesk.Api.csproj

      - name: Build
        run: dotnet build server/ArenaDesk.Api/ArenaDesk.Api.csproj --configuration Release --no-restore --warnaserror

      - name: Apply initial database schema
        env:
          PGPASSWORD: arena_ci
        run: psql --host 127.0.0.1 --username arena_desk --dbname arena_desk --file server/database/001_initial_schema.sql

      - name: Verify API and PostgreSQL readiness
        env:
          PGPASSWORD: arena_ci
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__ArenaDesk: Host=127.0.0.1;Port=5432;Database=arena_desk;Username=arena_desk;Password=arena_ci
          ArenaDesk__ClubName: ArenaDesk CI Club
          ArenaDesk__ComputerLimit: 10
          Cors__AllowedOrigins__0: http://localhost:3000
          Jwt__SigningKey: arena-desk-ci-signing-key-with-more-than-32-characters
          Jwt__Issuer: ArenaDesk.Api
          Jwt__Audience: ArenaDesk.Web
          Jwt__ExpirationHours: 8
          BootstrapUsers__AdministratorUsername: admin
          BootstrapUsers__AdministratorPassword: Admin123!
          BootstrapUsers__CashierUsername: cashier
          BootstrapUsers__CashierPassword: Cashier123!
        run: |
          dotnet run --project server/ArenaDesk.Api/ArenaDesk.Api.csproj --configuration Release --no-build > /tmp/arena-api.log 2>&1 &
          api_pid=$!
          on_exit() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              printf 'ArenaDesk API log after CI failure:\n'
              cat /tmp/arena-api.log
            fi
            kill "$api_pid" 2>/dev/null || true
            exit "$exit_code"
          }
          trap on_exit EXIT
          ready=false
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:5080/health/ready; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/arena-api.log
            exit 1
          fi

          admin_token=$(curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data '{"username":"admin","password":"Admin123!"}' \
            http://127.0.0.1:5080/api/v1/auth/login | jq --raw-output '.accessToken')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $admin_token" \
            http://127.0.0.1:5080/api/v1/auth/me | jq --exit-status '.role == "admin"'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $admin_token" \
            http://127.0.0.1:5080/api/v1/admin/users | jq --exit-status 'length == 2'

          cashier_token=$(curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data '{"username":"cashier","password":"Cashier123!"}' \
            http://127.0.0.1:5080/api/v1/auth/login | jq --raw-output '.accessToken')
          cashier_status=$(curl --silent --output /tmp/cashier-admin-response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $cashier_token" \
            http://127.0.0.1:5080/api/v1/admin/users)
          test "$cashier_status" = "403"

          printf 'Checking computer list...\n'
          computer_id=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $admin_token" \
            http://127.0.0.1:5080/api/v1/computers | jq --raw-output '.[0].id')
          printf 'Starting Standard session...\n'
          start_response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $admin_token" \
            --header "Content-Type: application/json" \
            --data "{\"computerId\":\"$computer_id\",\"durationMinutes\":60,\"customerName\":\"CI customer\",\"paymentMethod\":\"card\"}" \
            http://127.0.0.1:5080/api/v1/sessions/)
          session_id=$(jq --raw-output '.sessionId' <<< "$start_response")
          jq --exit-status '.status == "active" and .durationMinutes == 60 and .totalPrice == 15' <<< "$start_response"

          printf 'Extending session...\n'
          extend_response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $admin_token" \
            --header "Content-Type: application/json" \
            --data '{"durationMinutes":30,"paymentMethod":"cash"}' \
            http://127.0.0.1:5080/api/v1/sessions/$session_id/extend)
          jq --exit-status '.durationMinutes == 90 and .totalPrice == 22.5' <<< "$extend_response"

          printf 'Completing session...\n'
          complete_response=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $admin_token" \
            http://127.0.0.1:5080/api/v1/sessions/$session_id/complete)
          jq --exit-status '.status == "completed" and .totalPrice == 22.5' <<< "$complete_response"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $admin_token" \
            http://127.0.0.1:5080/api/v1/computers | \
            jq --exit-status --arg computer_id "$computer_id" '.[] | select(.id == $computer_id) | .status == "available" and .activeSession == null'
          test "$(psql --host 127.0.0.1 --username arena_desk --dbname arena_desk --tuples-only --no-align \
            --command "SELECT count(*) FROM payments WHERE session_id = '$session_id';")" = "2"
          test "$(psql --host 127.0.0.1 --username arena_desk --dbname arena_desk --tuples-only --no-align \
            --command "SELECT sum(amount) FROM payments WHERE session_id = '$session_id';")" = "22.50"
